<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Biblioteca Virtual</title>
    <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">📖 Biblioteca Virtual</span>
            <div>
                <span class="text-white me-3">Hola, <span sec:authentication="name"></span></span>
                <a th:href="@{/logout}" class="btn btn-outline-light">Cerrar sesión</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="alert alert-success">
            ✅ ¡Bienvenido a tu biblioteca virtual! Aquí podrás gestionar préstamos, libros y más.
        </div>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>📚 Mis préstamos</h5>
                        <p>Consulta los libros que tienes actualmente.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>🔍 Buscar libros</h5>
                        <p>Explora el catálogo completo.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>⭐ Recomendaciones</h5>
                        <p>Basado en tus lecturas anteriores.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
