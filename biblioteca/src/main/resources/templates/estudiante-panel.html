<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">📖 Biblioteca Digital</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white bg-dark bg-opacity-25 px-3 py-1 rounded-pill small">
                    👤 Estudiante: <strong th:text="${usuarioLogueado}">Usuario</strong>
                </span>
                <a href="/logout" class="btn btn-light btn-sm fw-bold text-primary shadow-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                <h4 class="card-title mb-0 text-secondary fw-semibold">Catálogo de Libros</h4>
                
                <div style="max-width: 350px;" class="w-100">
                    <input type="text" id="inputBuscador" class="form-control" placeholder="Buscar por título o autor...">
                </div>
            </div>
            
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3">Título del Libro</th>
                                <th class="py-3">Autor</th>
                                <th class="text-end pe-4 py-3">Opciones de Lectura</th>
                            </tr>
                        </thead>
                        <tbody id="tablaLibros">
                            <tr th:each="libro : ${libros}">
                                <td class="ps-4 fw-bold text-primary celda-titulo" th:text="${libro.titulo}"></td>
                                <td class="celda-autor" th:text="${libro.autor}"></td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/estudiante/libros/archivo/{id}(id=${libro.id})}" target="_blank" class="btn btn-outline-info btn-sm me-2 fw-semibold">Ver Online</a>
                                    <a th:href="@{/estudiante/libros/archivo/{id}(id=${libro.id}, descargar=true)}" class="btn btn-primary btn-sm fw-semibold">Descargar</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(libros)}" id="filaVacia">
                                <td colspan="3" class="text-center text-muted py-5">Aún no se han subido libros a la plataforma.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('inputBuscador').addEventListener('keyup', function() {
            let filtro = this.value.toLowerCase();
            let filas = document.querySelectorAll('#tablaLibros tr:not(#filaVacia)');
            
            filas.forEach(filas => {
                let titulo = filas.querySelector('.celda-titulo').textContent.toLowerCase();
                let autor = filas.querySelector('.celda-autor').textContent.toLowerCase();
                
                // Si el texto coincide con título o autor, se muestra; si no, se oculta
                if (titulo.includes(filtro) || autor.includes(filtro)) {
                    filas.style.display = "";
                } else {
                    filas.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
