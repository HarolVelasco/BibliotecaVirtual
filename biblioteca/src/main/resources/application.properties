# Nombre de la aplicación
spring.application.name=biblioteca

# CONFIGURACIÓN DE MYSQL
# (Asegúrate de crear una base de datos vacía llamada 'biblioteca_db' en tu phpMyAdmin/MySQL antes de arrancar)
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate properties
# 'update' creará las tablas automáticamente en MySQL si no existen, sin borrar tus datos anteriores
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar banner de Spring
spring.main.banner-mode=off