<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">🛠️ Panel de Control</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white bg-secondary bg-opacity-50 px-3 py-1 rounded-pill small">
                    🔑 Administrador: <strong th:text="${usuarioLogueado}">Admin</strong>
                </span>
                <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title mb-0 fw-semibold">Subir Nuevo Libro</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/libros/subir}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Título</label>
                                <input type="text" name="titulo" class="form-control" placeholder="Ej: Clean Code" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Autor</label>
                                <input type="text" name="autor" class="form-control" placeholder="Ej: Robert C. Martin" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Documento (PDF)</label>
                                <input type="file" name="archivo" class="form-control" accept=".pdf" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success fw-bold">Guardar en Biblioteca</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-secondary text-white py-3">
                        <h5 class="card-title mb-0 fw-semibold">Inventario de Archivos</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th class="ps-4 py-3">Título</th>
                                        <th class="py-3">Autor</th>
                                        <th class="text-center py-3">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="libro : ${libros}">
                                        <td class="ps-4 fw-bold text-dark" th:text="${libro.titulo}"></td>
                                        <td th:text="${libro.autor}"></td>
                                        <td class="text-center">
                                            <a th:href="@{/admin/libros/eliminar/{id}(id=${libro.id})}" 
                                               class="btn btn-danger btn-sm fw-mediumpx-3"
                                               onclick="return confirm('¿Seguro que deseas eliminar este libro?')">
                                                🗑️ Eliminar
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(libros)}">
                                        <td colspan="3" class="text-center text-muted py-5">No hay libros registrados en la biblioteca.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
